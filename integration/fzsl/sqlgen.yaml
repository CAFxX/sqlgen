# Fuzz/differential fixture (integration/fuzz_*_test.go). fzsl: dialect sqlite. The statements are identical
# across the fzsl and fzmy packages except for the RETURNING ones (see the end of the file); keep them in
# sync (TestFuzzYamlInSync enforces it).
package: fzsl
out: fzsl_gen.go
dialect: sqlite

statements:
  - name: FzInsertAsc
    kind: exec
    sql: |
      INSERT INTO fz_rows (id, grp, k1, k2, k3, k4, k5, k6, k7, k8, tag, tag2, note)
      VALUES :rows:[]FzNew(ID:int64 ASC, Grp:int64, K1:int64, K2:int64, K3:int64, K4:int64, K5:int64, K6:int64, K7:int64, K8:int64, Tag:string, Tag2:string, Note:*string)

  - name: FzInsertDesc
    kind: exec
    sql: |
      INSERT INTO fz_rows (id, grp, k1, k2, k3, k4, k5, k6, k7, k8, tag, tag2, note)
      VALUES :rows:[]FzNew(ID:int64 DESC, Grp:int64, K1:int64, K2:int64, K3:int64, K4:int64, K5:int64, K6:int64, K7:int64, K8:int64, Tag:string, Tag2:string, Note:*string)

  - name: FzInsertRaw
    kind: exec
    sql: |
      INSERT INTO fz_rows (id, grp, k1, k2, k3, k4, k5, k6, k7, k8, tag, tag2, note)
      VALUES :rows:[]FzNew(ID:int64, Grp:int64, K1:int64, K2:int64, K3:int64, K4:int64, K5:int64, K6:int64, K7:int64, K8:int64, Tag:string, Tag2:string, Note:*string)

  - name: FzInsertLit
    kind: exec
    sql: |
      INSERT INTO fz_rows (id, grp, k1, k2, k3, k4, k5, k6, k7, k8, tag, tag2, note)
      VALUES :rows:[]FzLit(ID:int64 ASC, Grp:int64, K1:int64, 1, 2, 3, 4, 5, 6, 7, Tag:string, 'a,)(', NULL)

  - name: FzSearch
    kind: many
    result_type: FzRow
    sql: |
      SELECT id:int64, grp:int64, k1:int64, k2:int64, k3:int64, k4:int64, k5:int64, k6:int64, k7:int64, k8:int64, tag:string, tag2:string, note:*string
      FROM fz_rows
      WHERE k1 >= :lo:int64
        {?ByGrp: AND grp = :grp:int64}
        {?ByGrps: AND grp IN (:grps:[]int64)}
        {?ByTags: AND tag IN (:tags:[]string)}
        {?FilterNote: AND note LIKE :note_like:string}
        {?NoteNull: AND note IS NULL}
        {?ByPairs: AND (grp, k2) IN (:pairs:[]FzPair(Grp:int64, K2:int64))}
        {?Narrow: AND k3 >= :lo:int64 AND k3 <= :hi:int64}
        {?HiK4: AND k4 <= :hi:int64}
      ORDER BY id

  - name: FzNarrow
    kind: many
    result_type: FzNarrowRow
    sql: |
      SELECT id:int64, grp:int64, k1:int64, k2:int64, tag:string, note:*string
      FROM fz_rows
      WHERE id >= :min_id:int64
        {?ByGrp: AND grp = :grp:int64}
      ORDER BY id

  - name: FzPage
    kind: many
    result_type: FzRow
    sql: |
      SELECT id:int64, grp:int64, k1:int64, k2:int64, k3:int64, k4:int64, k5:int64, k6:int64, k7:int64, k8:int64, tag:string, tag2:string, note:*string
      FROM fz_rows
      WHERE k1 >= :lo:int64
        {?ByGrps: AND grp IN (:grps:[]int64)}
        AND :After:sqlgen.Seek
        {?InSub: AND id IN (:sub:sqlgen.Query)}
        {?SkipTag: AND tag <> :ex_tag:string}
      ORDER BY :Sort:sqlgen.Order(grp, k1, k2, k3, k4, k5, k6, k7, k8, tag, tag2, id)
      LIMIT :limit:int64

  - name: FzSubGrps
    kind: subquery
    sql: |
      SELECT id FROM fz_rows
      WHERE grp IN (:grps:[]int64)
        {?MinK2: AND k2 >= :k2min:int64}

  - name: FzSubNote
    kind: subquery
    sql: |
      SELECT id FROM fz_rows
      WHERE note IS NOT NULL AND id IN (:inner:sqlgen.Query)
        {?MaxK3: AND k3 <= :k3max:int64}

  - name: FzAgg
    kind: many
    result_type: FzAggRow
    sql: |
      WITH picked AS (:pick:sqlgen.Query)
      SELECT grp:int64, COUNT(*) AS n:int64, COALESCE(SUM(k1), 0) AS total:int64
      FROM fz_rows
      WHERE id IN (SELECT id FROM picked)
        {?ByTag: AND tag = :tag:string}
      GROUP BY grp
      ORDER BY grp

  - name: FzByKeys
    kind: many
    result_type: FzRow
    sql: |
      SELECT id:int64, grp:int64, k1:int64, k2:int64, k3:int64, k4:int64, k5:int64, k6:int64, k7:int64, k8:int64, tag:string, tag2:string, note:*string
      FROM fz_rows
      WHERE (grp, k1) IN (:keys:[]FzKey(Grp:int64 ASC, K1:int64))
      ORDER BY id

  - name: FzByIDs
    kind: many
    result_type: FzRow
    sql: |
      SELECT id:int64, grp:int64, k1:int64, k2:int64, k3:int64, k4:int64, k5:int64, k6:int64, k7:int64, k8:int64, tag:string, tag2:string, note:*string
      FROM fz_rows
      WHERE id IN (:ids:[]int64)
      ORDER BY id

  - name: FzBump
    kind: exec
    sql: |
      UPDATE fz_rows SET k1 = k1 + :delta:int64, k2 = k2 - :delta:int64
      WHERE id IN (:ids:[]int64 ASC)
        {?OnlyGrp: AND grp = :grp:int64}

  - name: FzDelete
    kind: exec
    sql: |
      DELETE FROM fz_rows
      WHERE id IN (:ids:[]int64 DESC)
        {?OnlyTag: AND tag = :tag:string}

  - name: FzSubs
    kind: many
    result_type: FzRow
    sql: |
      SELECT id:int64, grp:int64, k1:int64, k2:int64, k3:int64, k4:int64, k5:int64, k6:int64, k7:int64, k8:int64, tag:string, tag2:string, note:*string
      FROM fz_rows
      WHERE id IN (:a:sqlgen.Query)
        AND k2 >= :lo:int64
        {?ExcludeB: AND id NOT IN (:b:sqlgen.Query)}
        {?AgainA: AND grp IN (SELECT grp FROM fz_rows WHERE id IN (:a:sqlgen.Query))}
      ORDER BY id

  - name: FzJoin
    kind: many
    result_type: FzJoinRow
    sql: |
      SELECT r.id:int64, r.grp:int64, r.k1:int64
        {?WithPeer: , p.id AS peer_id:int64, p.tag AS peer_tag:string}
      FROM fz_rows r
      {?WithPeer: JOIN fz_rows p ON p.id = r.k2 + :peer_off:int64}
      WHERE r.id >= :min_id:int64
        {?ByGrp: AND r.grp = :grp:int64}
      ORDER BY r.id

  # ---- column types other than int64 / string: int32, float64, bool, []byte, nullable *int32 ----
  - name: FzTypedInsert
    kind: exec
    sql: |
      INSERT INTO fz_typed (id, i32, f64, flag, bin, ni)
      VALUES :rows:[]FzTypedNew(ID:int64 ASC, I32:int32, F64:float64, Flag:bool, Bin:[]byte, NI:*int32)

  - name: FzTypedSearch
    kind: many
    result_type: FzTypedRow
    sql: |
      SELECT id:int64, i32:int32, f64:float64, flag:bool, bin:[]byte, ni:*int32
      FROM fz_typed
      WHERE f64 >= :lo:float64
        {?ByI32s: AND i32 IN (:i32s:[]int32)}
        {?ByF64s: AND f64 IN (:f64s:[]float64)}
        {?ByFlag: AND flag = :flag:bool}
        {?ByBin: AND bin = :bin:[]byte}
        {?NiAtLeast: AND ni >= :ni_min:*int32}
      ORDER BY id

  - name: FzTypedPage
    kind: many
    result_type: FzTypedRow
    sql: |
      SELECT id:int64, i32:int32, f64:float64, flag:bool, bin:[]byte, ni:*int32
      FROM fz_typed
      WHERE :After:sqlgen.Seek
      ORDER BY :Sort:sqlgen.Order(f64, i32, flag, id)
      LIMIT :limit:int64

  # ---- RETURNING (PostgreSQL / CockroachDB / MariaDB: INSERT and DELETE only) ----

  - name: FzInsertRet
    kind: many
    result_type: FzOut
    sql: |
      INSERT INTO fz_rows (id, grp, k1, k2, k3, k4, k5, k6, k7, k8, tag, tag2, note)
      VALUES :rows:[]FzNew(ID:int64 ASC, Grp:int64, K1:int64, K2:int64, K3:int64, K4:int64, K5:int64, K6:int64, K7:int64, K8:int64, Tag:string, Tag2:string, Note:*string)
      RETURNING id:int64, k1:int64

  - name: FzDeleteRet
    kind: many
    result_type: FzOut
    sql: |
      DELETE FROM fz_rows
      WHERE id IN (:ids:[]int64 DESC)
        {?OnlyTag: AND tag = :tag:string}
      RETURNING id:int64, k1:int64

  - name: FzBumpRet
    kind: many
    result_type: FzOut
    sql: |
      UPDATE fz_rows SET k1 = k1 + :delta:int64, k2 = k2 - :delta:int64
      WHERE id IN (:ids:[]int64 ASC)
        {?OnlyGrp: AND grp = :grp:int64}
      RETURNING id:int64, k1:int64

name: nightly

# The slow tiers the per-push workflow (ci.yml) leaves out: the full integration suite on YugabyteDB (per push
# it runs the SMOKE_RUN subset only), and the seeded differential fuzzers at a larger scale on one engine of
# each protocol family plus TiDB.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [yugabyte]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum
            pgxwire/go.sum
      - name: start ${{ matrix.engine }}
        run: make engines-up ENGINES=${{ matrix.engine }}
      - name: full integration suite against ${{ matrix.engine }}
        run: make test-integration ENGINES=${{ matrix.engine }} INTEG_TIMEOUT=35m GOTESTFLAGS=-v
      - name: engine logs on failure
        if: failure()
        run: docker compose logs --no-color ${{ matrix.engine }} | tail -200

  fuzz-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres18, mysql84, tidb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum
      - name: start ${{ matrix.engine }}
        run: make engines-up ENGINES=${{ matrix.engine }}
      # every fuzz suite (the API differentials and the wire-vs-sequential pipeline fuzzers) at 5x the per-push
      # case counts, with a fresh seed each night (the failure message prints the seed to replay)
      - name: differential fuzz x5 against ${{ matrix.engine }}
        run: SQLGEN_FUZZ_SCALE=5 make test-integration ENGINES=${{ matrix.engine }} RUN='Fuzz' INTEG_TIMEOUT=40m
      - name: engine logs on failure
        if: failure()
        run: docker compose logs --no-color ${{ matrix.engine }} | tail -200

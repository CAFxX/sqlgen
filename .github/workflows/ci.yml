name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gofmt, vet of every module, fixtures and generated code up to date (SPEC §13.1).
      - name: make check
        run: make check

      - name: tests (race) + coverage gate >= 95%
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          scripts/covgate.sh coverage.out 95 total

      - name: pgxwire and mysqlwire build and their hermetic tests pass (engine tests run in the engines job)
        run: make test-wire-hermetic

      # The seeded differential suite (integration/fuzz_*_test.go) needs no server for SQLite; the engines
      # job below runs the same cases on every server engine.
      - name: differential fuzz against SQLite (race)
        run: make test-fuzz-sqlite

      - name: fuzz (short)
        run: |
          go test -run '^$' -fuzz=FuzzParseSQL -fuzztime=10s .
          go test -run '^$' -fuzz=FuzzParseYAML -fuzztime=10s .
          go test -run '^$' -fuzz=FuzzEstimateOpBytesUpperBound -fuzztime=10s ./runtime
          go test -run '^$' -fuzz=FuzzEstimateMySQLOpBytesUpperBound -fuzztime=10s ./runtime
          go test -run '^$' -fuzz=FuzzVariantKeyAndSubqueryShapeBijectivity -fuzztime=10s ./runtime
          go test -run '^$' -fuzz=FuzzStmtCacheAdversarialStateTransitions -fuzztime=10s ./runtime

      - name: benchmarks (smoke)
        run: go test -run '^$' -bench=. -benchmem -benchtime=100ms ./runtime

  # Real engines: the same docker-compose.yml used locally (`make engines-up`), one engine per job so a
  # failure names the engine/version. SQLGEN_REQUIRE_ENGINES=1 turns a missing DSN into a failure,
  # so this job can never go green by skipping. YugabyteDB is the light tier here (smoke=1: the SMOKE_RUN
  # subset of the integration suite, see the Makefile); .github/workflows/nightly.yml runs its full suite.
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres15, postgres18, cockroach, mysql84, mysql97, mariadb1011, mariadb123, tidb]
        smoke: ['']
        include:
          - engine: yugabyte
            smoke: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum
            pgxwire/go.sum
            mysqlwire/go.sum
      - name: start ${{ matrix.engine }}
        run: make engines-up ENGINES=${{ matrix.engine }}
      - name: integration tests against ${{ matrix.engine }}
        run: make test-integration ENGINES=${{ matrix.engine }} SMOKE=${{ matrix.smoke }} INTEG_TIMEOUT=15m GOTESTFLAGS=-v
      # The pgxwire driver (single-round-trip pipelines) has its own tests against the PostgreSQL-protocol
      # engines; the integration module above additionally runs the wire-vs-sequential differential,
      # the network round-trip counts and the failure/concurrency tests through it.
      - name: pgxwire tests against ${{ matrix.engine }}
        if: startsWith(matrix.engine, 'postgres') || matrix.engine == 'cockroach' || matrix.engine == 'yugabyte'
        run: make test-pgxwire ENGINES=${{ matrix.engine }}
      # Likewise the mysqlwire driver against the MySQL-protocol engines.
      - name: mysqlwire tests against ${{ matrix.engine }}
        if: startsWith(matrix.engine, 'mysql') || startsWith(matrix.engine, 'mariadb') || matrix.engine == 'tidb'
        run: make test-mysqlwire ENGINES=${{ matrix.engine }}
      - name: engine logs on failure
        if: failure()
        run: docker compose logs --no-color ${{ matrix.engine }} | tail -200

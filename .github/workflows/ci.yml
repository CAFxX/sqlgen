name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi

      - name: go vet
        run: |
          go vet ./...
          (cd integration && go vet ./...)

      - name: generated code is up to date (SPEC §13.1)
        run: |
          for cfg in examples/*/sqlgen.yaml integration/*/sqlgen.yaml; do
            go run ./cmd/sqlgen -config "$cfg" -check
          done

      - name: tests (race) + coverage gate >= 95%
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t+0 >= 95.0) }' || { echo "coverage below 95%"; exit 1; }

      - name: fuzz (short)
        run: |
          go test -run '^$' -fuzz=FuzzParseSQL -fuzztime=10s .
          go test -run '^$' -fuzz=FuzzParseYAML -fuzztime=10s .
          go test -run '^$' -fuzz=FuzzEstimateOpBytesUpperBound -fuzztime=10s ./runtime
          go test -run '^$' -fuzz=FuzzVariantKeyAndSubqueryShapeBijectivity -fuzztime=10s ./runtime
          go test -run '^$' -fuzz=FuzzStmtCacheAdversarialStateTransitions -fuzztime=10s ./runtime

      - name: benchmarks (smoke)
        run: go test -run '^$' -bench=. -benchmem -benchtime=100ms ./runtime

  # Real engines: the same docker-compose.yml used locally (`make engines-up`), one engine per job so a
  # failure names the engine/version. SQLGEN_REQUIRE_ENGINES=1 turns a missing DSN into a failure,
  # so this job can never go green by skipping.
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres15, postgres18, cockroach, mysql84, mysql97, mariadb1011, mariadb123]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum
      - name: start ${{ matrix.engine }}
        run: docker compose up -d --wait ${{ matrix.engine }}
      - name: integration tests against ${{ matrix.engine }}
        run: |
          . scripts/engines-env.sh
          cd integration
          SQLGEN_REQUIRE_ENGINES=1 SQLGEN_ENGINES=${{ matrix.engine }} go test -race -count=1 -timeout 15m -v ./...
      - name: engine logs on failure
        if: failure()
        run: docker compose logs --no-color ${{ matrix.engine }} | tail -200

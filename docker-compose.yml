# Real-engine matrix for the integration suite (integration/). Used locally and mirrored in CI.
# Ports are overridable and deliberately away from the defaults so they never collide with other stacks.
#   make engines-up | engines-down | test-engines
name: sqlgen-engines

x-mysql-opts: &mysql-opts
  - --character-set-server=utf8mb4
  - --collation-server=utf8mb4_unicode_ci
  - --innodb-flush-log-at-trx-commit=0
  - --sync-binlog=0
  - --skip-log-bin

services:
  postgres15:
    image: postgres:15
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: password, POSTGRES_DB: sqlgen_test }
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=200"]
    ports: ["${SQLGEN_POSTGRES15_PORT:-54315}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d sqlgen_test"], interval: 3s, timeout: 5s, retries: 30 }

  postgres18:
    image: postgres:18
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: password, POSTGRES_DB: sqlgen_test }
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=200"]
    ports: ["${SQLGEN_POSTGRES18_PORT:-54318}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d sqlgen_test"], interval: 3s, timeout: 5s, retries: 30 }

  cockroach:
    image: cockroachdb/cockroach:v25.2.0
    # The suite creates and drops hundreds of tables and rewrites rows heavily. With the default 25h/4h
    # MVCC garbage-collection TTL all of that garbage stays in the in-memory store, and a 1 GiB store
    # filling up is a pebble fatal that kills the node mid-run (seen twice under the full suite). So: a
    # larger store, explicit cache / SQL memory budgets, and a 10 minute GC TTL, which the healthcheck sets
    # once (idempotent marker file) as soon as the node answers.
    command: ["start-single-node", "--insecure", "--store=type=mem,size=4GiB", "--cache=512MiB", "--max-sql-memory=512MiB"]
    ports: ["${SQLGEN_COCKROACH_PORT:-54326}:26257"]
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/.sqlgen-gc ] || { cockroach sql --insecure -e 'ALTER RANGE default CONFIGURE ZONE USING gc.ttlseconds = 600' && touch /tmp/.sqlgen-gc; }; cockroach sql --insecure -e 'select 1'"]
      interval: 3s
      timeout: 5s
      retries: 40

  mysql84:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: password, MYSQL_DATABASE: sqlgen_test }
    command: *mysql-opts
    ports: ["${SQLGEN_MYSQL84_PORT:-33184}:3306"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"], interval: 3s, timeout: 5s, retries: 60 }

  mysql97:
    image: mysql:9.7
    environment: { MYSQL_ROOT_PASSWORD: password, MYSQL_DATABASE: sqlgen_test }
    command: *mysql-opts
    ports: ["${SQLGEN_MYSQL97_PORT:-33197}:3306"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"], interval: 3s, timeout: 5s, retries: 60 }

  mariadb1011:
    image: mariadb:10.11
    environment: { MARIADB_ROOT_PASSWORD: password, MARIADB_DATABASE: sqlgen_test }
    command: *mysql-opts
    ports: ["${SQLGEN_MARIADB1011_PORT:-33111}:3306"]
    healthcheck: { test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"], interval: 3s, timeout: 5s, retries: 60 }

  mariadb123:
    image: mariadb:12.3
    environment: { MARIADB_ROOT_PASSWORD: password, MARIADB_DATABASE: sqlgen_test }
    command: *mysql-opts
    ports: ["${SQLGEN_MARIADB123_PORT:-33123}:3306"]
    healthcheck: { test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"], interval: 3s, timeout: 5s, retries: 60 }

  # TiDB (MySQL protocol, MySQL family): the all-in-one in-memory unistore, no PD/TiKV. The image has no database
  # creation env: the suite uses the pre-created `test` database with unique table names.
  tidb:
    image: pingcap/tidb:v8.5.8@sha256:df168c764bf2dfdb166dc37a5c3b0e210d29d5f3ab2d33317fd0fdf7b32037f5
    command: ["tidb-server", "--store=unistore", "--path=", "--host=0.0.0.0"]
    mem_limit: 2g
    ports: ["${SQLGEN_TIDB_PORT:-34000}:4000"]
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://127.0.0.1:10080/status"], interval: 3s, timeout: 5s, retries: 60 }

  # YugabyteDB (PostgreSQL protocol, PostgreSQL family; not the CockroachDB family). The memory limit is required:
  # without it the tserver sizes itself from the host RAM. It answers pg_isready only on the container hostname,
  # not on 127.0.0.1. Its data lives in an anonymous volume that `make engines-down` removes.
  yugabyte:
    image: yugabytedb/yugabyte:2025.2.9.0-b87@sha256:b62a0ed0d5b065c4f0b8764b1f3c3b496980d98aac46940e559ae9d5ddcb0243
    command: ["bin/yugabyted", "start", "--background=false"]
    mem_limit: 4g
    ports: ["${SQLGEN_YUGABYTE_PORT:-54335}:5433"]
    healthcheck: { test: ["CMD-SHELL", "postgres/bin/pg_isready -h $$(hostname) -p 5433"], interval: 5s, timeout: 5s, retries: 80 }
